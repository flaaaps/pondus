# Siehe docs/SERVER_DEPLOYMENT.md.
#
# Baut das API-Image (apps/api/Dockerfile, linux/arm64 für den Raspberry Pi) auf einem
# nativen arm64-Runner, führt vorher Typecheck und die API-Tests aus und veröffentlicht das
# Image in GitHub Packages (ghcr.io/flaaaps/pondus-api).
#
# Tags:
#   sha-<kurzer Commit>   jeder Lauf auf main (unveränderlich, für Rollbacks)
#   main                  letzter Stand von main
#   prod                  der Stand, dem der Pi folgt (Job "promote", Environment "production")
#   api-vX.Y.Z            bei Git-Tags api-v*
#
# Pull Requests bauen nur (kein Push), damit Dockerfile-Fehler vor dem Merge auffallen.
# Secrets braucht der Workflow keine: GITHUB_TOKEN reicht für ghcr.io.
name: API image

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/api-image.yml"
  push:
    branches: [main]
    tags: ["api-v*"]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:
    inputs:
      promote:
        description: "Nach dem Build auch als :prod markieren (der Pi zieht es dann)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pondus-api

jobs:
  test:
    name: Typecheck und Tests (API)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install (API und shared)
        run: pnpm install --frozen-lockfile --filter @pondus/api...
      - name: Typecheck
        run: pnpm --filter @pondus/shared typecheck && pnpm --filter @pondus/api typecheck
      - name: Lint
        run: pnpm --filter @pondus/api lint
      # Die Tests starten ein eingebettetes PostgreSQL (embedded-postgres, linux-arm64 prebuilt).
      - name: Tests
        run: pnpm --filter @pondus/api test

  build:
    name: Image bauen${{ github.event_name == 'pull_request' && ' (ohne Push)' || ' und veröffentlichen' }}
    needs: test
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # "version" (für den Output oben) ist der sha-Tag; main/api-v* kommen dazu.
          tags: |
            type=sha,prefix=sha-,priority=900
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Pondus API
            org.opencontainers.image.description=Fastify API of the Pondus strength-training app
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # Markiert den gebauten Stand als :prod. Das Environment "production" kann in den Repo-Einstellungen
  # einen Reviewer (Julian) verlangen; ohne Schutzregel läuft die Freigabe automatisch durch.
  promote:
    name: Als :prod freigeben
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.promote)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/pkgs/container/pondus-api
    steps:
      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Retag ohne Neubau: der Digest aus dem Build-Job bekommt zusätzlich den Tag "prod".
      - name: Tag prod
        run: docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE@${{ needs.build.outputs.digest }}"
      - name: Summary
        run: |
          echo "### :prod → \`${{ needs.build.outputs.sha_tag }}\` (${{ needs.build.outputs.digest }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Der Pi zieht das Image mit dem nächsten Lauf von podman-auto-update (spätestens nach 5 min)." >> "$GITHUB_STEP_SUMMARY"

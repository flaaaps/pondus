# Builds the marketing site (apps/web) and deploys it to GitHub Pages.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install (website only)
        run: pnpm install --frozen-lockfile --filter @pondus/web
      - id: pages
        uses: actions/configure-pages@v6
      - name: Check and build
        working-directory: apps/web
        env:
          PONDUS_WEB_SITE: ${{ steps.pages.outputs.origin }}
          PONDUS_WEB_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm run typecheck
          pnpm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Production stack: PostgreSQL + API. Works with docker compose and podman-compose.
#   cp .env.docker.example .env.docker   # then set real secrets
#   podman compose up -d --build
services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pondus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pondus
    env_file: .env.docker
    volumes:
      - pondus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pondus -d pondus"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: localhost/pondus-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4010
      DATABASE_URL: postgres://pondus:${POSTGRES_PASSWORD}@db:5432/pondus
    ports:
      - "127.0.0.1:4010:4010"

volumes:
  pondus_pgdata:

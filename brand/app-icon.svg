<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- iOS applies the squircle mask itself; keep the background square. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191D"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF9A3D"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g>
    <rect x="200" y="652" width="200" height="140" rx="44" fill="#F4F2EE" opacity="0.92"/>
    <rect x="200" y="452" width="420" height="140" rx="44" fill="#F4F2EE" opacity="0.96"/>
    <rect x="200" y="252" width="640" height="140" rx="44" fill="url(#bar)"/>
  </g>
</svg>

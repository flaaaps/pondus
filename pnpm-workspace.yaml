packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - embedded-postgres
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/darwin-x64"
  - "@node-rs/argon2"
  - esbuild
# Ships prebuilt binaries as optional dependencies; its build script is not needed.
ignoredBuiltDependencies:
  - "@parcel/watcher"
# pnpm ≥ 12 key for both lists above (true = build, false = skip)
allowBuilds:
  embedded-postgres: true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-x64": true
  "@node-rs/argon2": true
  esbuild: true
  "@parcel/watcher": false
